name: Skill Contract Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    name: Validate skill metadata and manifest wiring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run Bash skill contract check
        run: bash .github/scripts/check-starter-skills.sh

      - name: Run PowerShell skill contract check
        shell: pwsh
        run: .github/scripts/check-starter-skills.ps1