name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate starter assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Bash starter workflow checks
        run: bash .github/scripts/check-starter-workflow.sh

      - name: Run PowerShell starter workflow checks
        shell: pwsh
        run: .github/scripts/check-starter-workflow.ps1

  markdown:
    name: Check Markdown quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Bash Markdown quality check
        run: bash .github/scripts/check-markdown-quality.sh

      - name: Run PowerShell Markdown quality check
        shell: pwsh
        run: .github/scripts/check-markdown-quality.ps1

  hooks:
    name: Test hook policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Bash hook policy tests
        run: bash .github/scripts/check-hook-policy.sh

      - name: Run PowerShell hook policy tests
        shell: pwsh
        run: .github/scripts/check-hook-policy.ps1

  skills:
    name: Validate skill contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Bash skill contract check
        run: bash .github/scripts/check-starter-skills.sh

      - name: Run PowerShell skill contract check
        shell: pwsh
        run: .github/scripts/check-starter-skills.ps1
